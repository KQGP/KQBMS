name: kqbms
description: "A cross-platform companion app for generic Chinese Battery Management Systems"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  flutter_blue_plus: ^2.1.0
  provider: ^6.1.5+1
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon.png
  color_dark: "#000000"
  image_dark: assets/icon.png
  android: true
  ios: true
  web: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: false
  macos:
    generate: false
